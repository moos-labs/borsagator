name: Worker digest issue

# Issue #67 §4d (route 1, split merge): the worker archives a merged
# sweep on the `archive` branch; this workflow opens the digest issue
# from the archived digest.md, with the workflow token — the same
# credential and the same #113/#120 title/status handling as the
# Actions issue step. Only a sweep dir carrying merge-manifest.json
# may open an issue; a raw worker-run archive push must never do so.
# Idempotency: an issue is created only when no open issue already
# carries the same title (claim id + sweep dir are the identity).
on:
  push:
    branches: [archive]
    paths: ["sweeps/**"]

permissions:
  contents: read
  issues: write

jobs:
  file-worker-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive
          fetch-depth: 0

      - name: Open digest issues for newly merged sweeps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          python3 scripts/worker_digest_issue.py --before "$BEFORE" --after "$AFTER" --repo-dir . | while IFS="$(printf '\t')" read -r sweep_dir title; do
            [ -n "$sweep_dir" ] || continue
            if gh issue list --label borsagator --state open --search "$title" --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "issue already exists for $sweep_dir — skipping"
              continue
            fi
            echo "filing digest issue for $sweep_dir"
            gh issue create --title "$title" --body-file "$sweep_dir/digest.md" --label borsagator \
              || gh issue create --title "$title" --body-file "$sweep_dir/digest.md"
          done
