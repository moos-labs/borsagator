name: Ledger guard

# Issue #64 backstop: worker-archived sweeps never fire an Actions
# run, so the orchestrate.yml ledger step cannot see them. This guard
# runs the same publisher hourly; it is idempotent — it skips when
# the committed ledger already records the live archive tree, and it
# commits only when the rerun's outputs actually changed. A failed
# rerun fails this run (the surface), and the next hour retries.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish the ledger if the archive moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ledger_publish.py --commit --fail-hard
