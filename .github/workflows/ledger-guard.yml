name: Ledger guard

# Issue #64 backstop: worker-archived sweeps never fire an Actions
# run, so the orchestrate.yml ledger step cannot see them. This guard
# runs the same publisher hourly; every run revalidates the ledger
# (issue #116 removed the tree-sha idempotency skip) and it commits
# only when the rerun's outputs actually changed. A failed rerun
# fails this run (the surface), and the next hour retries.
# Issue #115: recreated 2026-11-16 (delete + re-create via the
# Contents API) to force a fresh schedule registration — the
# 09:23Z-14:23Z ticks never fired (six consecutive misses); repo
# and org Actions settings both rule out the cause.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish the ledger if the archive moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ledger_publish.py --commit --fail-hard
