name: Ledger guard watchdog

# Issue #128: the guard schedule missed 9 straight hourly ticks
# (#115) with nothing in-repo noticing — the misses were only visible
# from outside GitHub. The guard writes a timestamped heartbeat on
# every completed run (ledger/guard-heartbeat.json); this watchdog
# runs every 30 minutes and pages when no heartbeat is younger than
# 90 minutes, so a dead guard is noticed in-repo within 2h of its
# last heartbeat (90 + 30). The signal is a dedicated
# `ledger-failure` issue ("Ledger guard dead"), never a digest issue,
# filed or commented on by scripts/ledger_guard_watch.py; a fresh
# heartbeat closes it again. This is a separate schedule registration
# from the guard's own — it does not share #115's registration — and
# the guard is the retry path for failed publishes, so the watchdog
# is load-bearing here, not a nicety.
#
# Issue #156: the watchdog asks the Actions API whether a
# ledger-guard run is queued / waiting / in progress before paging.
# The guard shares the borsagator-ledger-publish concurrency group
# with the whole orchestrate job, so a guard tick queues behind a
# running sweep while the heartbeat ages past 90 minutes — without
# the pending-run check that is a false "Ledger guard dead" signal.
# While a guard run is pending, no signal is filed (and no open
# signal is closed — the heartbeat is still stale); past the
# 420-minute maximum latency the signal fires anyway. That lookup
# needs `actions: read` on the token below.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Issue #156: the watchdog lists ledger-guard workflow runs to
  # tell a queued guard from a missing execution.
  actions: read

jobs:
  ledger-guard-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the guard heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ledger_guard_watch.py --heartbeat ledger/guard-heartbeat.json
