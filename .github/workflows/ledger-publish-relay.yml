name: ledger-publish-relay

# Issue #443: turn a staged ledger publish into a merged PR.
#
# Why this exists: main's branch protection requires the
# `close-gate` status check, and a commit pushed directly by the
# worker never carries one — every direct ledger publish was
# declined by the protected-branch hook and the ledger went stale
# from 2026-11-20. The publisher (scripts/ledger_publish.py
# --publish-branch) now pushes each publish as ONE envelope commit
# (validated ledger outputs + the run's guard heartbeat) to a
# per-run staging branch publish/ledger-<run-id>. This relay is
# the only component that turns a staging branch into main:
#
#   verify the branch diff against main is ledger/** only
#   -> open the PR (or reuse the one already open for this head)
#   -> execute the REAL close-gate on the candidate SHA via an
#      explicit workflow_dispatch of pr-close-gate.yml
#   -> wait for that gate run to succeed
#   -> merge with the exact-head precondition
#   -> verify the merge (and the run's heartbeat) on main
#   -> dispatch deploy-guard against main
#   -> comment the recovery evidence (the full chain) on the open
#      ledger-failure signal issue — comment only, never close:
#      closing the signal stays with the verified-recovery process
#   -> delete the staging branch (only after a verified merge;
#      a failed deletion is bookkeeping debt, not a failed
#      publication, and a failed relay NEVER deletes the branch)
#
# INS-REVIEW-075 bindings:
# (A) A PR opened with GITHUB_TOKEN only receives
#     approval-required pull_request workflow runs, so "open PR,
#     wait, merge" does not run unattended. The gate is therefore
#     executed by explicit dispatch, bound to the candidate SHA:
#     the dispatch runs pr-close-gate.yml at the staging ref (its
#     diff is verified ledger-only first, so the gate script is
#     byte-identical to main's reviewed copy) and the resulting
#     close-gate check run lands on the PR head SHA, satisfying
#     the required context/app. No check run is ever synthesised.
# (B) A landed staging push means PENDING, not published. Only a
#     confirmed merge + verified main contents produce the
#     recovery bookkeeping. A crash after merge reconciles as
#     already-merged (the assess step finds the merged PR for
#     this branch + head and re-verifies main) — never a
#     duplicate PR.
# (C) Integrity: the diff-scope check runs before any privileged
#     step; the merge carries the exact-head sha precondition;
#     head drift, a wrong base or unexpected paths refuse the
#     relay. All privileged logic lives in THIS file and runs
#     from main (see the trigger note below).
# (D) A GITHUB_TOKEN merge does not fire push workflows on main,
#     so deploy-guard is dispatched explicitly after the merge
#     and its conclusion is recorded in the chain. Issue #502:
#     the dispatch carries a correlation id and the merge commit
#     as target_sha; deploy-guard verifies that exact commit and
#     emits evidence as a run artifact, and the relay matches
#     the evidence (run id, correlation, target, verified HEAD)
#     before the chain comment may use recovered wording — a
#     successful conclusion alone is not evidence.
# (E) Least-privilege permissions are declared below. Failed
#     staging branches are retained for diagnosis.
#
# Trigger shape: this workflow is workflow_dispatch ONLY, always
# executing main's reviewed copy. The push of a staging branch is
# handled by ledger-publish-relay-kick.yml, a minimal workflow
# whose single action is dispatching this relay with the branch
# name — so no branch-controlled file ever executes with this
# workflow's write credentials (change C). The manual Actions
# guard (ledger-guard.yml) dispatches this relay directly,
# because its staging push is made with GITHUB_TOKEN and
# GITHUB_TOKEN pushes do not fire workflows at all.
#
# Merge-race hardening (live evidence, PR #494's first relay,
# 2026-11-22): branch protection reads the NEWEST close-gate
# check on the candidate SHA, and the PR's own approval-required
# pull_request check can materialize after the relay dispatches
# its gate — shadowing the dispatched success and refusing the
# merge — while GitHub's mergeability computation itself lags
# by seconds. The gate step therefore settles before dispatch,
# verifies the NEWEST check (not just any), re-dispatches when
# shadowed, and the merge step retries a refused merge with
# backoff under the same exact-head precondition.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Staging branch to relay (publish/ledger-<run-id>)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: borsagator-ledger-relay
  cancel-in-progress: false
  # queue: max — with the default queueing, a third dispatch
  # cancels the pending second run (review finding on #491);
  # every staged envelope keeps its relay run. Serialization
  # itself is wanted: two envelopes staged from the same main
  # both rewrite the heartbeat, so parallel merges would
  # conflict — serial relays + the merge step's superseded
  # diagnosis keep that case fail-closed and explained.
  queue: max

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the staging branch
        id: resolve
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$INPUT_BRANCH" in
            publish/ledger-*) ;;
            *) echo "::error::refusing to relay non-staging branch '$INPUT_BRANCH'"; exit 1 ;;
          esac
          echo "branch=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "run_id=${INPUT_BRANCH#publish/ledger-}" >> "$GITHUB_OUTPUT"
          echo "Relaying $INPUT_BRANCH (run ${INPUT_BRANCH#publish/ledger-})"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assess the staging branch
        id: assess
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          prs() {
            gh pr list --head "$BRANCH" --state all --limit 10 \
              --json number,state,headRefOid,mergeCommit,mergedAt,baseRefName
          }
          # Issue #500: pre-merge envelope validation against
          # the envelope's DECLARED base (its single parent):
          # base in main's history and equal to the merge-base,
          # changed paths vs the base ledger/** only, parsed
          # heartbeat ordering (not regressive vs the base, not
          # superseded by main's current heartbeat). Unrelated
          # main changes do NOT refuse the envelope — base-tip
          # equality would over-reject them. The validator is
          # scripts/check_relay_envelope.py from THIS main
          # checkout (privileged logic never comes from the
          # staged branch); the merge step re-runs it against
          # the freshly fetched main before merging.
          validate_envelope() {
            if ! python3 scripts/check_relay_envelope.py \
                --repo-dir . --stage "$SHA" \
                --main-ref origin/main > /tmp/envcheck.json; then
              cat /tmp/envcheck.json || true
              echo "::error::envelope validation refused $BRANCH at $SHA (issue #500) — see the verdict above"
              exit 1
            fi
            out base_sha "$(jq -r .base_sha /tmp/envcheck.json)"
            out staged_at "$(jq -r '.staged_at // ""' /tmp/envcheck.json)"
            echo "Envelope validation passed (issue #500): declared base $(jq -r .base_sha /tmp/envcheck.json), staged heartbeat $(jq -r '.staged_at // "none"' /tmp/envcheck.json)"
          }
          if git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null; then
            SHA=$(git rev-parse "refs/remotes/origin/$BRANCH")
            out sha "$SHA"
            # --no-renames + unquoted paths (PR #515 review):
            # both sides of a rename face the scope check, and a
            # non-ASCII path is checked as the path it is.
            PATHS=$(git -c core.quotepath=false diff --no-renames --name-only "origin/main...$SHA")
            if [ -z "$PATHS" ]; then
              # No changes vs main: either an earlier relay already
              # merged this envelope and the branch was re-created
              # empty (reconcile below), or the publisher staged
              # nothing — which its envelope design never does.
              MERGED=$(prs | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")] | length')
              if [ "$MERGED" -ge 1 ]; then
                out mode reconciled
                out merge_sha "$(prs | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")][0].mergeCommit.oid')"
                out pr_number "$(prs | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")][0].number')"
                echo "Branch carries no diff and a merged PR exists — reconciling as already-merged."
                exit 0
              fi
              echo "::error::staging branch $BRANCH has an empty diff vs main and no merged PR — nothing to relay"
              exit 1
            fi
            BAD=$(echo "$PATHS" | grep -v '^ledger/' || true)
            if [ -n "$BAD" ]; then
              echo "::error::staging branch $BRANCH touches paths outside ledger/** — refusing the relay:"
              echo "$BAD"
              exit 1
            fi
            echo "Diff scope verified (ledger/** only):"
            echo "$PATHS"
            J=$(prs)
            MERGED_SHA=$(echo "$J" | jq -r --arg s "$SHA" '[.[] | select(.state=="MERGED" and .headRefOid==$s and .baseRefName=="main")][0].mergeCommit.oid // empty')
            if [ -n "$MERGED_SHA" ]; then
              out mode reconciled
              out merge_sha "$MERGED_SHA"
              out pr_number "$(echo "$J" | jq -r --arg s "$SHA" '[.[] | select(.state=="MERGED" and .headRefOid==$s and .baseRefName=="main")][0].number')"
              echo "A merged PR for this exact head exists — reconciling as already-merged (change B)."
              exit 0
            fi
            OPEN_N=$(echo "$J" | jq -r '[.[] | select(.state=="OPEN")] | length')
            if [ "$OPEN_N" -ge 1 ]; then
              # A reused PR must target main: the merge step merges
              # whatever base the PR has, so an open PR for this
              # head aimed elsewhere is refused, never ridden
              # (review finding on #491).
              OPEN_BASE=$(echo "$J" | jq -r '[.[] | select(.state=="OPEN")][0].baseRefName')
              if [ "$OPEN_BASE" != "main" ]; then
                echo "::error::open PR for $BRANCH targets base '$OPEN_BASE', not main — refusing to reuse it (change C)"
                exit 1
              fi
              OPEN_SHA=$(echo "$J" | jq -r '[.[] | select(.state=="OPEN")][0].headRefOid')
              if [ "$OPEN_SHA" != "$SHA" ]; then
                echo "::error::open PR head $OPEN_SHA has drifted from the staged head $SHA — refusing (change C)"
                exit 1
              fi
              validate_envelope
              out mode fresh
              out pr_number "$(echo "$J" | jq -r '[.[] | select(.state=="OPEN")][0].number')"
              echo "Reusing the open PR for this head (idempotent)."
              exit 0
            fi
            CLOSED_N=$(echo "$J" | jq -r '[.[] | select(.state=="CLOSED")] | length')
            if [ "$CLOSED_N" -ge 1 ]; then
              echo "::error::a closed-unmerged PR exists for $BRANCH — a human intervened; refusing to reopen the question automatically"
              exit 1
            fi
            validate_envelope
            out mode fresh
            out pr_number ""
          else
            # Branch gone: a previous relay run merged and deleted
            # it, then crashed before finishing (change B), or the
            # branch never existed (a dispatch error — fail loudly).
            J=$(prs)
            MERGED_N=$(echo "$J" | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")] | length')
            if [ "$MERGED_N" -ge 1 ]; then
              out mode reconciled
              out sha "$(echo "$J" | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")][0].headRefOid')"
              out merge_sha "$(echo "$J" | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")][0].mergeCommit.oid')"
              out pr_number "$(echo "$J" | jq -r '[.[] | select(.state=="MERGED" and .baseRefName=="main")][0].number')"
              echo "Branch is gone and a merged PR exists — reconciling as already-merged."
              exit 0
            fi
            echo "::error::staging branch $BRANCH not found and no merged PR exists for it — nothing to relay"
            exit 1
          fi

      # Issue #503: a PR opened with GITHUB_TOKEN only receives
      # approval-required pull_request workflow runs, which sit
      # unapproved and then fail at merge time (the paired PR
      # Agent / pr-close-gate failures). A PR opened with the
      # Borsagator App's installation token is not held that way
      # (proven live on test PR #523, 2026-11-23).
      # INS-REVIEW-105 narrows the App's use to the one operation
      # whose actor identity matters — CREATING and MERGING the PR.
      # The token is minted in fresh mode: a new PR and a reused
      # PR both end at the merge. Since 2026-11-25 the
      # merge-gate-approval ruleset requires an approving review
      # on main; GITHUB_TOKEN can neither approve nor bypass it,
      # so the merge runs as the App (an always-bypass actor in
      # that ruleset). Every other step runs on GITHUB_TOKEN.
      # The action is pinned to the
      # full commit SHA of its v1 tag — a mutable major tag must
      # not be able to change what runs with the App key.
      - name: Mint the Borsagator App token
        id: apptoken
        if: steps.assess.outputs.mode == 'fresh'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: 5709364
          private-key: ${{ secrets.BORSAGATOR_APP_PRIVATE_KEY }}

      - name: Open the PR
        id: openpr
        if: steps.assess.outputs.mode == 'fresh' && steps.assess.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          BODY=$(printf 'Automated ledger publish for run `%s`, staged on `%s` and relayed by ledger-publish-relay (issue #443).\n\nThe branch diff against main was verified ledger/** only before this PR was opened. The required close-gate is executed on the candidate commit by explicit workflow dispatch, and this PR is merged by the relay once that gate succeeds.\n\nRelated to #443.' "$RUN_ID" "$BRANCH")
          NUM_URL=$(gh pr create --base main --head "$BRANCH" \
                  --title "Publish calibration ledger (For #443)" \
                  --body "$BODY")
          NUM="${NUM_URL##*/}"
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "Opened PR #$NUM ($NUM_URL)"

      - name: Execute the close-gate on the candidate SHA and wait
        if: steps.assess.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          SHA: ${{ steps.assess.outputs.sha }}
          PR_NUMBER: ${{ steps.openpr.outputs.pr_number || steps.assess.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Settle: a just-opened PR's own pull_request gate run
          # materializes a few seconds after the open (with
          # GITHUB_TOKEN it was also approval-required — #503) and
          # seconds after the open. Branch protection reads the
          # NEWEST close-gate check on the candidate SHA, so the
          # dispatched run's check must be created after it —
          # dispatching instantly can leave the dispatched success
          # shadowed by the still-pending approval-required check
          # (proven live on PR #494's first relay, 2026-11-22:
          # gate success at 10:40:15, merge refused at 10:40:16).
          sleep 20
          # Dispatch → wait → verify, in up to 3 rounds. Branch
          # protection reads the NEWEST close-gate check run on
          # the candidate SHA; a check created after ours (the
          # PR's approval-required check if it materialized late,
          # or a re-triggered pull_request run) can shadow a
          # successful dispatched check with a non-success state.
          # Re-dispatching makes our check the newest again. A
          # gate run that concludes non-success is a real refusal
          # — it exits immediately, never re-dispatched.
          GATE_OK=""
          for ROUND in 1 2 3; do
            BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run pr-close-gate.yml --ref "$BRANCH" -f pr_number="$PR_NUMBER"
            echo "close-gate dispatched for PR #$PR_NUMBER on $BRANCH ($SHA), round $ROUND"
            # Find the dispatched run (newest workflow_dispatch
            # run of the gate on this branch created at/after the
            # dispatch). NOTE: gh api's --jq takes a bare filter —
            # jq's --arg is NOT accepted there (review finding on
            # #491); $BEFORE is a machine-generated ISO timestamp
            # (digits, '-', ':', 'T', 'Z' only), safe to
            # interpolate into the filter.
            RUN_ID=""
            for i in $(seq 1 12); do
              RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-close-gate.yml/runs?branch=$BRANCH&event=workflow_dispatch&per_page=10" \
                --jq "[.workflow_runs[] | select(.created_at >= \"$BEFORE\")][0].id // empty")
              [ -n "$RUN_ID" ] && break
              sleep 10
            done
            if [ -z "$RUN_ID" ]; then
              echo "::error::the dispatched close-gate run never appeared for PR #$PR_NUMBER"
              exit 1
            fi
            echo "close-gate run: $RUN_ID"
            # Wait for the run to complete (15-minute cap; the
            # gate normally finishes in about a minute).
            DEADLINE=$(( $(date +%s) + 900 ))
            while : ; do
              read -r STATUS CONCLUSION HEAD_SHA < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                --jq '[.status, (.conclusion // "-"), .head_sha] | @tsv')
              if [ "$STATUS" = "completed" ]; then
                if [ "$HEAD_SHA" != "$SHA" ]; then
                  echo "::error::close-gate run $RUN_ID executed on $HEAD_SHA, not the candidate $SHA — refusing"
                  exit 1
                fi
                if [ "$CONCLUSION" != "success" ]; then
                  echo "::error::close-gate run $RUN_ID concluded $CONCLUSION for PR #$PR_NUMBER — refusing to merge"
                  exit 1
                fi
                break
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "::error::close-gate run $RUN_ID did not complete within 15 minutes"
                exit 1
              fi
              sleep 20
            done
            # The required context itself: the NEWEST close-gate
            # check run on the candidate SHA must be the success —
            # that is the state branch protection merges against.
            # "Newest" sorts by check-run id: ids are monotonic
            # with creation, and check runs carry no created_at
            # field (verified against a real payload from PR
            # #494 — a created_at sort key is null for every run
            # and would silently degrade to API return order).
            NEWEST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="close-gate")] | sort_by(.id) | last | "\(.status)/\(.conclusion // "-")"')
            if [ "$NEWEST" = "completed/success" ]; then
              GATE_OK=1
              echo "close-gate succeeded on $SHA and is its newest check (run $RUN_ID)"
              break
            fi
            echo "::warning::newest close-gate check on $SHA is '$NEWEST', not completed/success — a later-created check shadows the dispatched success; re-dispatching"
            sleep 10
          done
          if [ -z "$GATE_OK" ]; then
            echo "::error::the close-gate check on $SHA never became the newest successful check — refusing to merge"
            exit 1
          fi

      - name: Merge the PR (exact-head precondition)
        id: merge
        if: steps.assess.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          SHA: ${{ steps.assess.outputs.sha }}
          PR_NUMBER: ${{ steps.openpr.outputs.pr_number || steps.assess.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Bounded retries: GitHub computes mergeability
          # asynchronously and the required-check state can lag
          # the gate step by seconds (PR #494's first relay,
          # 2026-11-22: dispatched gate success verified, merge
          # refused one second later, PR mergeable shortly
          # after). Every attempt keeps the exact-head
          # precondition; an already-merged PR reconciles at any
          # attempt (an earlier relay merged, then crashed).
          # Issue #500: re-validate the envelope against the
          # ACTUAL merge candidate — main as fetched NOW, not as
          # the assess step saw it — before the first attempt and
          # after every refused attempt, so a concurrent update
          # (above all a newer envelope landing first) cannot
          # slip a superseded or regressive envelope through.
          recheck_envelope() {
            # PR #515 review: this function is called under
            # `if !`, which suspends errexit inside it — a
            # failed fetch would otherwise fall through to
            # validation against the STALE origin/main. Fail
            # the recheck explicitly when the refresh fails.
            git fetch origin main || return 1
            python3 scripts/check_relay_envelope.py \
              --repo-dir . --stage "$SHA" --main-ref origin/main \
              > /tmp/recheck.json
          }
          if ! recheck_envelope; then
            cat /tmp/recheck.json || true
            echo "::error::envelope re-validation against current main refused the merge (issue #500)"
            exit 1
          fi
          MERGED_SHA=""
          for ATTEMPT in 1 2 3 4 5; do
            if MERGE_SHA=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
                -f merge_method=merge -f sha="$SHA" --jq .sha 2>/tmp/merge-err); then
              MERGED_SHA="$MERGE_SHA"
              echo "Merged PR #$PR_NUMBER at $MERGED_SHA (attempt $ATTEMPT)"
              break
            fi
            cat /tmp/merge-err || true
            read -r STATE MCS < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.state, (.merge_commit_sha // "-")] | @tsv')
            if [ "$STATE" = "closed" ] && [ "$MCS" != "-" ] && [ -n "$MCS" ]; then
              MERGED=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merged)
              if [ "$MERGED" = "true" ]; then
                MERGED_SHA="$MCS"
                echo "PR #$PR_NUMBER was already merged at $MCS — reconciling."
                break
              fi
            fi
            if [ "$ATTEMPT" -lt 5 ]; then
              if ! recheck_envelope; then
                cat /tmp/recheck.json || true
                echo "::error::envelope became invalid while merging (issue #500 recheck) — refusing further attempts"
                exit 1
              fi
              echo "merge attempt $ATTEMPT refused — retrying in 30s"
              sleep 30
            fi
          done
          if [ -z "$MERGED_SHA" ]; then
            # Superseded diagnosis (review finding on #491): two
            # envelopes staged from the same main both rewrite the
            # heartbeat, so once one merges, the other's PR
            # conflicts and the merge API refuses. That outcome is
            # fail-closed by design — nothing stale publishes, the
            # staging branch is retained, the affected worker slot
            # refuses done and the next slot stages from the new
            # main — but the log must say so plainly, not read as
            # a gate or permission failure.
            git fetch origin main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
            STAGED_AT=$(git show "refs/remotes/origin/$BRANCH:ledger/guard-heartbeat.json" 2>/dev/null | jq -r '.last_run_utc // ""' || true)
            MAIN_AT=$(git show origin/main:ledger/guard-heartbeat.json 2>/dev/null | jq -r '.last_run_utc // ""' || true)
            if [ -n "$STAGED_AT" ] && [ -n "$MAIN_AT" ] && [[ "$MAIN_AT" > "$STAGED_AT" ]]; then
              echo "::warning::main already carries a NEWER guard heartbeat ($MAIN_AT > staged $STAGED_AT) — this envelope was superseded by a later merged run and its PR now conflicts; not merging is the designed outcome"
            fi
            echo "::error::merge of PR #$PR_NUMBER failed and the PR is not merged"
            exit 1
          fi
          echo "merge_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify the merge on main
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha || steps.assess.outputs.merge_sha }}
          STAGE_SHA: ${{ steps.assess.outputs.sha }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          # Make sure the staged commit itself is present
          # locally for the blob comparison below (PR #515
          # review): fetching main alone does not guarantee it
          # in every mode. In reconciled mode the branch may
          # already be deleted — the staged commit is then an
          # ancestor of the merge and arrives with main — so a
          # failed branch fetch is tolerated HERE; the listing
          # capture below still fails closed if the commit
          # cannot be listed.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "::error::merge commit $MERGE_SHA is not on main — publication NOT verified"
            exit 1
          fi
          # INS-REVIEW-093: bind the landing to the expected merge.
          # A relay merge must be a true merge of the staged
          # envelope onto main: exactly two parents, with the
          # second parent being the staged commit itself. A
          # squash, a fast-forward, or a merge whose second
          # parent is not $STAGE_SHA would land the wrong tree
          # under the staged SHA's path scope and the
          # blob-equality check below could still pass against
          # the wrong content.
          PARENTS=$(git rev-list --parents -n 1 "$MERGE_SHA")
          PARENT_COUNT=$(echo "$PARENTS" | wc -w)
          if [ "$PARENT_COUNT" -ne 3 ]; then
            echo "::error::merge $MERGE_SHA has $PARENT_COUNT whitespace fields from rev-list --parents (expected 3: sha + 2 parents) — not a two-parent merge; publication NOT verified"
            exit 1
          fi
          FIRST_PARENT=$(echo "$PARENTS" | awk '{print $2}')
          STAGE_PARENT=$(echo "$PARENTS" | awk '{print $3}')
          if [ "$STAGE_PARENT" != "$STAGE_SHA" ]; then
            echo "::error::merge $MERGE_SHA's second parent is $STAGE_PARENT, not the staged commit $STAGE_SHA — the merge does not bind the staged envelope; publication NOT verified"
            exit 1
          fi
          echo "merge $MERGE_SHA is a two-parent merge: first parent $FIRST_PARENT (main at merge time), second parent $STAGE_SHA (staged envelope)"
          # INS-REVIEW-093: frozen manifest. The envelope's
          # declared change set is the diff of the staged commit
          # against its own parent (the base the publisher
          # declared), captured with --no-renames and unquoted
          # paths so a renamed or non-ASCII path is checked as
          # the path it is. DELETED_PATHS is the --diff-filter=D
          # subset of that manifest.
          MANIFEST_PATHS=$(git -c core.quotepath=false diff --no-renames --name-only "$STAGE_SHA^" "$STAGE_SHA")
          DELETED_PATHS=$(git -c core.quotepath=false diff --no-renames --name-only --diff-filter=D "$STAGE_SHA^" "$STAGE_SHA")
          # INS-REVIEW-093: every path the envelope DELETED must
          # be ABSENT at the merge. A deletion in the staged
          # envelope is a contract: the file is gone. If the
          # merge tree still carries it — main re-added it, or
          # the merge resolved the deletion the other way — the
          # envelope did not land as staged.
          if [ -n "$DELETED_PATHS" ]; then
            while IFS= read -r DEL_PATH; do
              [ -z "$DEL_PATH" ] && continue
              if git rev-parse -q --verify "$MERGE_SHA:$DEL_PATH" >/dev/null 2>&1; then
                echo "::error::envelope deleted $DEL_PATH at $STAGE_SHA but it is still present at merge $MERGE_SHA — the staged deletion did not land; publication NOT verified"
                exit 1
              fi
            done <<< "$DELETED_PATHS"
            echo "all ${DELETED_PATHS//$'\n'/ }deleted manifest paths are absent at merge $MERGE_SHA"
          fi
          # INS-REVIEW-093: no unexpected introduced paths. Every
          # path introduced by the merge (first-parent -> merge)
          # must be a path the envelope itself changed. Main may
          # independently have acquired identical content for a
          # manifest path (a concurrent envelope), so the
          # introduced set is a SUBSET of the manifest set, not
          # an exact equality — a smaller introduced set is fine.
          # A path outside the manifest means the merge brought
          # in something the envelope never declared.
          INTRODUCED=$(git -c core.quotepath=false diff --no-renames --name-only "$FIRST_PARENT" "$MERGE_SHA")
          if [ -n "$INTRODUCED" ]; then
            MANIFEST_SORTED=$(echo "$MANIFEST_PATHS" | sort)
            while IFS= read -r INT_PATH; do
              [ -z "$INT_PATH" ] && continue
              if ! grep -Fxq "$INT_PATH" <<< "$MANIFEST_SORTED"; then
                echo "::error::merge $MERGE_SHA introduces $INT_PATH, which is not a path the staged envelope changed — unexpected introduced path; publication NOT verified"
                exit 1
              fi
            done <<< "$INTRODUCED"
            echo "every introduced path at merge $MERGE_SHA is a member of the staged manifest"
          fi
          # INS-REVIEW-093: freshness against the ACTUAL first-parent
          # state. The manifest above was computed from the staged
          # commit's own declared base ($STAGE_SHA^); here the
          # envelope is re-validated against the merge's real first
          # parent — the main tip the relay merged onto — so a
          # concurrent main update between the assess step and the
          # merge cannot leave the landed envelope stale or
          # regressive relative to the state it actually landed on.
          # A refusal here is a real failure: exit 1, no success
          # wording, no downstream dispatch.
          if ! python3 scripts/check_relay_envelope.py \
              --repo-dir . --stage "$STAGE_SHA" --main-ref "$FIRST_PARENT" \
              > /tmp/verify-envelope.json 2>&1; then
            cat /tmp/verify-envelope.json || true
            echo "::error::envelope freshness refused for $STAGE_SHA against first parent $FIRST_PARENT (INS-REVIEW-093) — publication NOT verified"
            exit 1
          fi
          echo "envelope freshness verified against first parent $FIRST_PARENT: $(jq -r '.base_sha // "n/a"' /tmp/verify-envelope.json)"
          # Issue #498: the verdict is read at the ORIGINAL merge
          # commit, never at the moving main tip. The heartbeat
          # verified here is the one THIS merge landed (the staged
          # envelope's own heartbeat, byte-identical in the merge
          # tree), and the merge's full ledger tree must equal the
          # staged commit's ledger tree — full expected-content
          # equality, not a run-id spot check. Whatever main
          # carries NOW (a later envelope may already have
          # superseded this one) is reported separately below and
          # never rewrites this verdict.
          HB=$(git show "$MERGE_SHA:ledger/guard-heartbeat.json")
          HB_RUN=$(echo "$HB" | jq -r '.run_id // ""')
          HB_STATUS=$(echo "$HB" | jq -r '.status // ""')
          HB_AT=$(echo "$HB" | jq -r '.last_run_utc // ""')
          echo "heartbeat at merge $MERGE_SHA: run_id=$HB_RUN status=$HB_STATUS last_run_utc=$HB_AT"
          if [ "$HB_RUN" != "$RUN_ID" ]; then
            echo "::error::the heartbeat landed by merge $MERGE_SHA belongs to run $HB_RUN, not $RUN_ID — publication NOT verified"
            exit 1
          fi
          # Full expected-content equality: every blob of the
          # staged envelope must be present, byte-identical, at
          # the same path in the merge tree. (Files main gained
          # elsewhere in ledger/ are not this envelope's content
          # and do not falsify its landing; no staged byte may be
          # missing or altered.)
          # PR #515 review: capture the staged listing in a
          # plain assignment — inside process substitution a
          # failed ls-tree was invisible (the loop read zero
          # entries, MISMATCH stayed empty, and verification
          # "passed" without comparing a single blob). Under
          # set -e a failed capture aborts the step; an empty
          # listing refuses explicitly.
          STAGE_LISTING=$(git ls-tree -r "$STAGE_SHA" -- ledger/)
          if [ -z "$STAGE_LISTING" ]; then
            echo "::error::staged commit $STAGE_SHA lists no ledger content — the envelope cannot be verified, publication NOT verified"
            exit 1
          fi
          MISMATCH=""
          while IFS=$'\t' read -r META PATH_; do
            STAGE_BLOB=$(echo "$META" | awk '{print $3}')
            MERGE_BLOB=$(git rev-parse -q --verify "$MERGE_SHA:$PATH_" 2>/dev/null || echo "")
            if [ "$MERGE_BLOB" != "$STAGE_BLOB" ]; then
              MISMATCH="$MISMATCH $PATH_"
            fi
          done <<< "$STAGE_LISTING"
          if [ -n "$MISMATCH" ]; then
            echo "::error::merge $MERGE_SHA does not carry the staged envelope's content for:$MISMATCH — full-content equality failed, publication NOT verified"
            exit 1
          fi
          echo "every staged envelope blob is present byte-identical in merge $MERGE_SHA"
          echo "hb_run=$HB_RUN" >> "$GITHUB_OUTPUT"
          echo "hb_status=$HB_STATUS" >> "$GITHUB_OUTPUT"
          echo "hb_at=$HB_AT" >> "$GITHUB_OUTPUT"
          # Later main state, reported separately (issue #498):
          # informational only — it never feeds the verdict or
          # the recovery wording above. PR #515 review: this
          # read is NON-FATAL — if a later commit removed or
          # broke the heartbeat file, the original merge's
          # verdict (already established above) must still
          # reach the deploy + comment steps; report the later
          # state as unavailable instead of aborting.
          MAIN_HB_RUN=""
          MAIN_HB_STATUS=""
          MAIN_HB_AT=""
          MAIN_HB=$(git show origin/main:ledger/guard-heartbeat.json 2>/dev/null || echo "")
          if [ -n "$MAIN_HB" ]; then
            MAIN_HB_RUN=$(echo "$MAIN_HB" | jq -r '.run_id // ""' 2>/dev/null || echo "")
            MAIN_HB_STATUS=$(echo "$MAIN_HB" | jq -r '.status // ""' 2>/dev/null || echo "")
            MAIN_HB_AT=$(echo "$MAIN_HB" | jq -r '.last_run_utc // ""' 2>/dev/null || echo "")
          else
            echo "later main state unavailable (heartbeat unreadable on current main) — the verdict above stands"
          fi
          echo "current main heartbeat (later state): run_id=$MAIN_HB_RUN status=$MAIN_HB_STATUS last_run_utc=$MAIN_HB_AT"
          echo "main_hb_run=$MAIN_HB_RUN" >> "$GITHUB_OUTPUT"
          echo "main_hb_status=$MAIN_HB_STATUS" >> "$GITHUB_OUTPUT"
          echo "main_hb_at=$MAIN_HB_AT" >> "$GITHUB_OUTPUT"
          echo "Publication verified at the original merge commit $MERGE_SHA"

      - name: Dispatch deploy-guard against main
        id: deployguard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha || steps.assess.outputs.merge_sha }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -uo pipefail
          # Issue #502: the dispatch names its target — the
          # merge commit this relay just verified — and carries
          # a correlation id unique to this relay run + slot.
          # deploy-guard checks the target out explicitly,
          # verifies its actual HEAD, and emits evidence (run id,
          # correlation, target, verified HEAD) as a run
          # artifact; the evidence is matched below before the
          # chain comment may use recovered wording. The run's
          # head_sha is NOT evidence: with dispatch --ref main it
          # identifies the workflow ref, not the target.
          CORRELATION="relay-${{ github.run_id }}-$RUN_ID"
          echo "correlation_id=$CORRELATION" >> "$GITHUB_OUTPUT"
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! gh workflow run deploy-guard.yml --ref main \
              -f correlation_id="$CORRELATION" \
              -f target_sha="$MERGE_SHA"; then
            echo "conclusion=dispatch-failed" >> "$GITHUB_OUTPUT"
            echo "evidence=unverified" >> "$GITHUB_OUTPUT"
            echo "::warning::deploy-guard dispatch failed — bookkeeping debt, recorded in the chain comment (the publication itself is verified)"
            exit 0
          fi
          # PR #515 review (INS-REVIEW-092): select the run by
          # CORRELATION, not by timestamp alone. The old
          # "newest run created after BEFORE" pick could select
          # ANOTHER dispatch that landed after ours; its
          # evidence then (correctly) mismatched and recovery
          # stayed unverified despite our run's matching
          # evidence existing. A deploy-guard run is ours when
          # its evidence artifact carries our correlation id —
          # keep scanning the completed candidates until one
          # matches or the deadline passes.
          RUN_ID=""
          DEADLINE=$(( $(date +%s) + 360 ))
          while : ; do
            CANDIDATES=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-guard.yml/runs?branch=main&event=workflow_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$BEFORE\") | select(.status==\"completed\") | .id] | join(\" \")")
            for CAND in $CANDIDATES; do
              CAND_ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAND/artifacts" \
                --jq "[.artifacts[] | select(.name==\"deploy-guard-evidence-$CORRELATION\")][0].id // empty")
              if [ -n "$CAND_ART" ]; then
                RUN_ID="$CAND"
                break
              fi
            done
            [ -n "$RUN_ID" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then break; fi
            sleep 15
          done
          if [ -z "$RUN_ID" ]; then
            echo "conclusion=dispatched-unseen" >> "$GITHUB_OUTPUT"
            echo "evidence=unverified" >> "$GITHUB_OUTPUT"
            echo "::warning::deploy-guard dispatched but no completed run carrying correlation $CORRELATION appeared within six minutes"
            exit 0
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '.conclusion // "unknown"')
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          # Issue #502: a successful run is not yet evidence.
          # Match the run's evidence artifact against THIS
          # dispatch: correlation id, target sha and verified
          # HEAD must all be the merge commit, and the evidence
          # run id must be this run. Only then may the chain
          # comment use recovered wording.
          EVIDENCE="unverified"
          if [ "$CONCLUSION" = "success" ]; then
            ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq "[.artifacts[] | select(.name==\"deploy-guard-evidence-$CORRELATION\")][0].id // empty")
            if [ -n "$ART_ID" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > /tmp/dg-evidence.zip 2>/dev/null \
                && unzip -p /tmp/dg-evidence.zip deploy-guard-evidence.json > /tmp/dg-evidence.json 2>/dev/null; then
              EV_RUN=$(jq -r '.run_id // ""' /tmp/dg-evidence.json)
              EV_CORR=$(jq -r '.correlation_id // ""' /tmp/dg-evidence.json)
              EV_TARGET=$(jq -r '.target_sha // ""' /tmp/dg-evidence.json)
              EV_HEAD=$(jq -r '.verified_head // ""' /tmp/dg-evidence.json)
              if [ "$EV_RUN" = "$RUN_ID" ] && [ "$EV_CORR" = "$CORRELATION" ] \
                  && [ "$EV_TARGET" = "$MERGE_SHA" ] && [ "$EV_HEAD" = "$MERGE_SHA" ]; then
                EVIDENCE="verified"
              else
                echo "::warning::deploy-guard evidence mismatch — run $EV_RUN, correlation $EV_CORR, target $EV_TARGET, verified HEAD $EV_HEAD; expected run $RUN_ID, correlation $CORRELATION, target/HEAD $MERGE_SHA"
              fi
            else
              echo "::warning::deploy-guard run $RUN_ID succeeded but its evidence artifact could not be read — evidence unverified"
            fi
          fi
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"
          echo "deploy-guard run $RUN_ID: $CONCLUSION, evidence $EVIDENCE (recorded in the chain; its own run is the alarm if red)"

      - name: Comment the recovery evidence on the publish-failure signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          STAGE_SHA: ${{ steps.assess.outputs.sha }}
          PR_NUMBER: ${{ steps.openpr.outputs.pr_number || steps.assess.outputs.pr_number }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha || steps.assess.outputs.merge_sha }}
          HB_RUN: ${{ steps.verify.outputs.hb_run }}
          HB_STATUS: ${{ steps.verify.outputs.hb_status }}
          HB_AT: ${{ steps.verify.outputs.hb_at }}
          MAIN_HB_RUN: ${{ steps.verify.outputs.main_hb_run }}
          MAIN_HB_STATUS: ${{ steps.verify.outputs.main_hb_status }}
          MAIN_HB_AT: ${{ steps.verify.outputs.main_hb_at }}
          DG_RUN: ${{ steps.deployguard.outputs.run_id }}
          DG_CONCLUSION: ${{ steps.deployguard.outputs.conclusion }}
          DG_EVIDENCE: ${{ steps.deployguard.outputs.evidence }}
          DG_CORRELATION: ${{ steps.deployguard.outputs.correlation_id }}
        run: |
          set -euo pipefail
          # The open publish-failure signal (issue #128's label +
          # title prefix — the same dedup key the publisher uses).
          # Comment ONLY: closing the signal stays with the
          # verified-recovery process, and guard-dead signals
          # (the watchdog's kind) are never touched from here.
          Q=$(python3 -c "import urllib.parse; print(urllib.parse.quote('repo:$GITHUB_REPOSITORY label:ledger-failure state:open', safe=''))")
          NUMBERS=$(gh api "search/issues?q=$Q&per_page=20" \
            --jq '[.items[] | select(.title | startswith("⚠️ Ledger publish failed"))] | .[].number')
          if [ -z "$NUMBERS" ]; then
            echo "No open publish-failure signal — nothing to comment."
            exit 0
          fi
          # The wording follows the merged envelope's own
          # heartbeat status (review finding on #491): an ok
          # envelope updated the ledger; a failed-status envelope
          # is liveness evidence only and must never read as a
          # ledger recovery.
          if [ "$HB_STATUS" = "ok" ] && [ "$DG_EVIDENCE" = "verified" ]; then
            BODY=$(printf '✅ **Ledger publish landed via the PR relay (issue #443).**\n\n- Slot / run: `%s`\n- Staging branch: `%s` at `%s`\n- PR: #%s\n- Close-gate: executed by workflow dispatch on the candidate SHA — success\n- Merge commit: `%s`\n- Heartbeat on main: run `%s`, status `%s`, at `%s`\n- Deploy verification: deploy-guard run `%s` — `%s`, evidence verified (correlation `%s`, target + verified HEAD = the merge commit)\n\nThe committed ledger on `main` is current again. (This comment is the relay'\''s recovery evidence; the signal itself is closed by the verified-recovery process, not by the relay.)' \
              "$RUN_ID" "$BRANCH" "$STAGE_SHA" "$PR_NUMBER" "$MERGE_SHA" "$HB_RUN" "$HB_STATUS" "$HB_AT" "${DG_RUN:-none}" "${DG_CONCLUSION:-unknown}" "${DG_CORRELATION:-none}")
          elif [ "$HB_STATUS" = "ok" ]; then
            # Issue #502: the envelope landed, but deploy-guard's
            # evidence did not verify against this merge — the
            # wording must NOT read as a confirmed recovery.
            BODY=$(printf '⚠️ **Ledger publish landed via the PR relay (issue #443), but deploy verification evidence is UNVERIFIED — recovery is NOT confirmed.**\n\n- Slot / run: `%s`\n- Staging branch: `%s` at `%s`\n- PR: #%s\n- Close-gate: executed by workflow dispatch on the candidate SHA — success\n- Merge commit: `%s`\n- Heartbeat on main: run `%s`, status `%s`, at `%s`\n- Deploy verification: deploy-guard run `%s` — `%s`, evidence `%s` (correlation `%s`)\n\nThe committed ledger on `main` carries this run'\''s envelope (verified at the merge commit), but the deploy-guard run dispatched against that merge did not produce matching evidence (correlation / target / verified HEAD), so this comment does not confirm the deploy side. (This comment is the relay'\''s evidence; the signal itself is closed by the verified-recovery process, not by the relay.)' \
              "$RUN_ID" "$BRANCH" "$STAGE_SHA" "$PR_NUMBER" "$MERGE_SHA" "$HB_RUN" "$HB_STATUS" "$HB_AT" "${DG_RUN:-none}" "${DG_CONCLUSION:-unknown}" "${DG_EVIDENCE:-unverified}" "${DG_CORRELATION:-none}")
          else
            BODY=$(printf '⚠️ **A failed-status guard heartbeat landed via the PR relay (issue #443) — the ledger outputs were NOT updated by this run.**\n\n- Slot / run: `%s`\n- Staging branch: `%s` at `%s`\n- PR: #%s\n- Close-gate: executed by workflow dispatch on the candidate SHA — success\n- Merge commit: `%s`\n- Heartbeat on main: run `%s`, status `%s`, at `%s`\n- Deploy verification: deploy-guard run `%s` — `%s`, evidence `%s`\n\nThe guard'\''s liveness record on `main` is current again (the watchdog sees this run), but the publish failure itself stands until a later run lands an ok envelope. (This comment is the relay'\''s evidence; the signal itself is closed by the verified-recovery process, not by the relay.)' \
              "$RUN_ID" "$BRANCH" "$STAGE_SHA" "$PR_NUMBER" "$MERGE_SHA" "$HB_RUN" "$HB_STATUS" "$HB_AT" "${DG_RUN:-none}" "${DG_CONCLUSION:-unknown}" "${DG_EVIDENCE:-unverified}")
          fi
          # Issue #498: when main has already moved past this
          # merge, say so as a separate later-state line — the
          # recovery wording above is the ORIGINAL merge's
          # verdict (verified at $MERGE_SHA) and is not rewritten
          # by the later state.
          if [ -n "${MAIN_HB_RUN:-}" ] && [ "$MAIN_HB_RUN" != "$HB_RUN" ]; then
            BODY=$(printf '%s\n\nLater main state (reported separately, issue #498): main now carries run `%s`, status `%s`, at `%s` — a later envelope has superseded this one on main; the verdict above stands as verified at its own merge.' \
              "$BODY" "$MAIN_HB_RUN" "$MAIN_HB_STATUS" "$MAIN_HB_AT")
          fi
          for N in $NUMBERS; do
            # $MERGE_SHA is a hex git SHA — safe to interpolate
            # into the filter (gh api --jq has no --arg; see the
            # gate-discovery note above).
            # PR #515 review: an existing comment for this merge
            # is not automatically final — if it was posted with
            # UNVERIFIED evidence and the evidence has since
            # verified (a rerun obtained it), the signal must
            # not keep saying "recovery is NOT confirmed".
            # Identical body → skip (idempotent); different
            # body for the same merge → UPDATE the existing
            # comment in place.
            EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments?per_page=100" \
              --jq "[.[] | select(.body | contains(\"$MERGE_SHA\"))] | .[0].id // empty")
            if [ -n "$EXISTING" ]; then
              CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" --jq .body)
              if [ "$CURRENT" = "$BODY" ]; then
                echo "Signal #$N already carries this merge with the current body — skipping (idempotent)."
                continue
              fi
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -f body="$BODY" > /dev/null
              echo "Updated the existing relay comment on signal #$N for merge $MERGE_SHA (the evidence changed)."
              continue
            fi
            gh issue comment "$N" --body "$BODY"
            echo "Recovery evidence commented on signal #$N"
          done

      - name: Delete the staging branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -uo pipefail
          # Issue #499: deletion is safe ONLY because the done
          # evidence does not live on this branch — the verify
          # step above judged the retained merge commit, the
          # chain comment records the staging commit + merge
          # commit, and the worker persists the expected envelope
          # (heartbeat content, blob hashes, envelope commit) on
          # its bus before confirmation. This step runs last,
          # after all of that; never move it earlier.
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" 2>/tmp/del-err; then
            echo "Deleted $BRANCH (merge verified above)."
          else
            cat /tmp/del-err || true
            echo "::warning::could not delete $BRANCH after a verified merge — bookkeeping debt, not a failed publication; the branch is inert and a later cleanup can remove it"
          fi

