name: Borsagator

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job, e.g. 'sweep POUL.CA' or 'run tradingagents POUL.CA' (empty = use the JOB variable)"
        required: false
        default: ""
  schedule:
    # Issue #66: the worker owns the 08:15 Cairo trigger now; this
    # cron is only the FALLBACK, staggered to 06:45 UTC = 08:45 Cairo
    # (winter) / 09:45 (summer DST) — still before the EGX 10:00
    # open. The fallback-check job below stands the run down when
    # the worker already claimed today's sched-<date> job.
    # Scheduled runs use the JOB_SCHEDULED variable (default
    # 'sweep-lite POUL.CA').
    - cron: "45 6 * * 0,1,2,3,4"

permissions:
  contents: write
  issues: write

jobs:
  # Issue #66: the worker fires the scheduled sweep at 08:15 Cairo;
  # this job stands the Actions fallback down when the worker already
  # claimed today's job (queue/claims/sched-<date>.json on the queue
  # branch) or already archived it (worker-runs/<date>/ on the
  # archive branch). The claim is the single mutex. Scheduled runs
  # only — manual dispatches always run. If this job fails or is
  # skipped, the sweep job runs anyway (a failed check must never
  # silently cancel the morning's only sweep).
  fallback-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the queue branch (claims)
        uses: actions/checkout@v4
        with:
          ref: queue
          path: queue-branch

      - name: Check out the archive branch (worker runs)
        uses: actions/checkout@v4
        with:
          ref: archive
          path: archive-branch

      - name: Decide whether the worker already fired today
        id: check
        run: |
          TODAY=$(TZ=Africa/Cairo date +%F)
          SKIP=$(python3 scripts/fallback_skip_check.py --date "$TODAY" \
            --claims-dir queue-branch/queue/claims \
            --archive-dir archive-branch/worker-runs \
            --done-dir queue-branch/queue/done)
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Worker-fired check for $TODAY: skip=$SKIP"

  orchestrate:
    needs: fallback-check
    # The fallback stands down only when the check job ran and said
    # so; a skipped check (manual dispatch) or a failed check leaves
    # the sweep running. `always()` keeps the job alive when its
    # needed job is skipped or fails.
    if: always() && (github.event_name != 'schedule' || needs.fallback-check.outputs.skip != 'true')
    # Issue #126: serialize ledger publishers — GitHub concurrency is
    # job-scoped, not step-scoped, so the group sits on the whole job
    # (the ledger publish is a step inside it), shared with the
    # ledger-guard job under the same group name. cancel-in-progress:
    # false so a queued run waits instead of killing a sweep in
    # flight. Whole sweep runs therefore serialize when they overlap
    # — scheduled once daily, so that needs a manual dispatch, and
    # concurrent sweeps already race on the archive-branch push. The
    # publisher's own recompute-and-retry remains the primary
    # defence, so a queued run still lands if two publishers ever
    # get through at once.
    concurrency:
      group: borsagator-ledger-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute the fleet repository list
        id: fleet
        run: |
          repos=$(python3 -c "import json; rs=[t['repo'] for t in json.load(open('registry/tools.json'))['tools']]; print(','.join(['borsagator'] + rs))")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "Token scope: $repos"

      - name: Mint the Borsagator app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BORSAGATOR_APP_ID }}
          private-key: ${{ secrets.BORSAGATOR_APP_PRIVATE_KEY }}
          owner: moos-labs
          repositories: ${{ steps.fleet.outputs.repos }}

      - name: Install the token-minting dependency
        run: pip install pyjwt cryptography

      - name: Run the gator
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The orchestrator mints/refreshes its own installation tokens
          # from these (App tokens live 1h; full sweeps run longer).
          BORSAGATOR_APP_ID: ${{ secrets.BORSAGATOR_APP_ID }}
          BORSAGATOR_APP_PRIVATE_KEY: ${{ secrets.BORSAGATOR_APP_PRIVATE_KEY }}
          JOB: ${{ github.event_name == 'schedule' && (vars.JOB_SCHEDULED || 'sweep-lite POUL.CA') || inputs.job || vars.JOB }}
        run: python3 scripts/orchestrate.py

      - name: Run the ensemble synthesizer
        if: always()
        run: python3 scripts/ensemble.py || true

      # Issue #79: freeze the benchmark entrants (family-alone,
      # Kronos-alone, raw-LLM, buy-and-hold) from this sweep's
      # ensemble + Kronos path, before the archive stage. Never
      # fails the sweep: the freeze exits 0 always and a missing
      # benchmark/ dir is legal.
      - name: Freeze the benchmark entrants
        if: always()
        run: python3 scripts/benchmark_freeze.py || true

      - name: Stage the sweep archive
        id: archive-stage
        if: always()
        run: |
          # Issue #118: the ledger step runs only when the archive
          # actually landed — record the staged target as the marker.
          python3 scripts/archive.py || true
          if [ -f archive_stage/TARGET.txt ]; then
            echo "target=$(cat archive_stage/TARGET.txt)" >> "$GITHUB_OUTPUT"
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      # Issue #68: compile the Report Model from this sweep's staged
      # archive tree, before the archive commit copies it to the
      # archive branch. The compiler reads one sweep dir
      # (digest.json + ensemble.json + collected/ + manifest.json at
      # the top level), which only exists as archive_stage/data once
      # the archive stage above has run — the live layout
      # (digest/, collected/ at the repo root) is not a sweep dir,
      # so this step sits here, not right after the ensemble step,
      # and after the #79 freeze so the model's benchmark section
      # sees the frozen entrants. The compiler runs against a copy
      # of the staged tree named by the archive target (so the
      # model's sweep_dir is the archive-relative path, and so the
      # sweep dir is outside any git checkout — the tree SHA is
      # then honestly null with a flag, instead of the main tree
      # SHA mislabelled as the archive tree); the emitted
      # report-model.json (or compile_error.txt on a fail-loudly
      # refusal) is copied back into archive_stage/data, which the
      # commit step below archives unchanged. The archive SHA is
      # the archive HEAD at compile time (the commit before this
      # sweep's own archive commit, which does not exist yet).
      # Never fails the sweep: a refused or crashed compile leaves
      # the sweep archived without a model, with the refusal
      # recorded. The manifest's file list (written by the archive
      # stage above) does not cover the model — see #68.
      - name: Compile the Report Model
        if: always()
        run: |
          if [ ! -f archive_stage/TARGET.txt ]; then
            echo "No archive target staged — nothing to compile."
            exit 0
          fi
          TARGET=$(cat archive_stage/TARGET.txt)
          STAGE_SWEEP="/tmp/borsagator-model/$TARGET"
          mkdir -p "$(dirname "$STAGE_SWEEP")"
          cp -r archive_stage/data "$STAGE_SWEEP"
          ARGS=(--compiler-sha "${{ github.sha }}")
          ARCHIVE_SHA=$(git ls-remote origin refs/heads/archive | awk '{print $1}')
          if [ -n "$ARCHIVE_SHA" ]; then
            ARGS+=(--archive-sha "$ARCHIVE_SHA")
          fi
          python3 scripts/compile_model.py "$STAGE_SWEEP" "${ARGS[@]}" || true
          cp "$STAGE_SWEEP/report-model.json" archive_stage/data/report-model.json 2>/dev/null || true
          cp "$STAGE_SWEEP/compile_error.txt" archive_stage/data/compile_error.txt 2>/dev/null || true

      - name: Commit the archive
        id: archive-commit
        if: always()
        run: |
          # Issue #118: archive_ok=true only when the push actually
          # landed — the ledger step below gates on this output, so a
          # failed archive can never publish a stale-as-current ledger.
          # A failed archive stays non-fatal for the sweep itself.
          echo "archive_ok=false" >> "$GITHUB_OUTPUT"
          if [ ! -f archive_stage/TARGET.txt ]; then
            echo "No archive target staged — nothing to commit."
            exit 0
          fi
          TARGET=$(cat archive_stage/TARGET.txt)
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          git config user.name "borsagator-archive"
          git config user.email "moos@sherbeeny.com"
          if git ls-remote --exit-code origin archive >/dev/null 2>&1; then
            git fetch origin "+refs/heads/archive:refs/remotes/origin/archive" || true
            git worktree add -b archive /tmp/arch origin/archive || true
          else
            git worktree add --orphan -b archive /tmp/arch || true
          fi
          if [ ! -e /tmp/arch/.git ]; then
            echo "Archive worktree setup failed — skipping commit."
            exit 0
          fi
          mkdir -p "/tmp/arch/$TARGET"
          cp -r archive_stage/data/. "/tmp/arch/$TARGET/"
          cd /tmp/arch || exit 0
          git add -A
          if git commit -m "Archive sweep: $TARGET"; then
            if git push origin archive; then
              echo "archive_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "ARCHIVE PUSH FAILED (non-fatal)"
            fi
          else
            echo "nothing to commit — archive not updated"
          fi

      # Issue #64: after the sweep is archived, rerun the calibration
      # ledger against the archive and publish ledger/ to main. The
      # publisher validates the run, appends a ledger section (or a
      # ⚠️ failure line) to the digest, and commits only on change.
      # It never fails the sweep on a degraded run. The token is the
      # workflow token (contents: write) — the App token has no
      # Contents access. The git push here uses the checkout's
      # persisted workflow token, NEVER the app token minted in step
      # 5 (which the gator step alone consumes) — so a long gator
      # step cannot expire this push (issue #119 follow-up: the
      # expired-app-token theory for run 43889942381 was refuted;
      # its push died on a rebase conflict, not on expiry).
      # Issue #119 follow-up: --fail-push — a push failure that
      # survives the publisher's reset + recompute retry fails this
      # step (run 43889942381's step exited 0 while publishing
      # nothing, and only the digest warning disclosed it).
      # Issue #118: this step runs ONLY when the archive push landed
      # (steps.archive-commit.outputs.archive_ok) — with an
      # if: always() here it would read the previous archive tree and
      # publish a ledger omitting this sweep while the digest claims
      # it is current. LEDGER_SWEEP_TARGET lets the publisher refuse
      # the same way if the tree does not contain this sweep.
      - name: Rerun + publish the calibration ledger
        if: always() && steps.archive-commit.outputs.archive_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_SWEEP_TARGET: ${{ steps.archive-commit.outputs.target }}
        run: python3 scripts/ledger_publish.py --digest digest/digest.md --commit --fail-push

      # Issue #118: when the archive did not land, the ledger step
      # above is skipped — say so in the digest instead of publishing
      # a ledger that omits this sweep while claiming to be current.
      - name: Note the skipped ledger in the digest
        if: always() && steps.archive-commit.outputs.archive_ok != 'true'
        run: |
          if [ -f digest/digest.md ]; then
            {
              echo ""
              echo "## ⚠️ Calibration ledger"
              echo ""
              echo "⚠️ This sweep was not archived on branch \`archive\`"
              echo "(the archive step failed or its push failed), so the"
              echo "ledger rerun was skipped — the committed ledger on main"
              echo "was NOT updated and does not include this sweep. Treat"
              echo "the published weights as stale until the next successful"
              echo "rerun."
            } >> digest/digest.md
          fi

      - name: Upload the digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest/
          if-no-files-found: ignore

      - name: Open the digest issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Issue #113: never file with an empty title. The gator now
          # heads digest.md up front, but a headerless/missing file
          # must still fall back to digest.json's job — the JSON is
          # written before the markdown and survives a gator death
          # (run 43815097317: head -n 1 of a headerless file was empty
          # and `gh issue create --title ""` failed, losing the digest).
          if [ ! -f digest/digest.md ] && [ -f digest/digest.json ]; then
            job=$(python3 -c "import json; print(json.load(open('digest/digest.json')).get('job',''))" 2>/dev/null || echo "")
            job=${job:-"run ${{ github.run_id }}"}
            printf '# 🐊 Borsagator digest — %s\n\n<!-- borsagator-digest-status: failed -->\n\n_Gator digest missing — see digest.json._\n' "$job" > digest/digest.md
          fi
          # Issue #120: a digest still marked "running" means the sweep
          # died mid-run before the orchestrator could record a failure
          # (SIGKILL / runner crash / hard timeout) — it must NEVER be
          # filed as a finished run. Replace the placeholder line with
          # a failure notice (what died: the sweep itself, mid-run;
          # when: now) and flag the title FAILED. A digest marked
          # "failed" is filed with the FAILED title flag as well; a
          # "complete" (or unmarked legacy) digest is filed as before.
          if [ -f digest/digest.md ]; then
            GITHUB_RUN_ID=${{ github.run_id }} python3 - <<'PYEOF'
          import os, re
          from datetime import datetime, timezone
          path = "digest/digest.md"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          m = re.search(r"borsagator-digest-status: (\w+)", text)
          status = m.group(1) if m else None
          if status in ("running", "failed"):
              when = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              run_id = os.environ.get("GITHUB_RUN_ID", "?")
              if status == "running":
                  notice = ("⚠️ **SWEEP FAILED — died mid-run.** The sweep "
                            "was still marked running when the issue step ran "
                            f"({when}); the orchestrator never recorded a "
                            "failure, so it died without warning (runner "
                            "crash, timeout, or SIGKILL). This is NOT a "
                            "completed sweep — do not treat the absence of "
                            f"results as an all-clear. (Run {run_id}.)")
                  # New placeholder wording (#120) first, then the
                  # pre-#120 wording, so either placeholder is caught.
                  for sentinel in (
                          "⚠️ **SWEEP INCOMPLETE — this digest was never finished.**",
                          "_Running — tools in progress; replaced by the full digest when the sweep finishes._"):
                      if sentinel in text:
                          text = text.replace(sentinel, notice, 1)
                          break
                  else:
                      # Placeholder wording drifted — prepend the notice
                      # right after the header instead of dropping it.
                      head, sep, rest = text.partition("\n")
                      text = head + "\n\n" + notice + "\n" + (sep + rest if sep else "")
                  text = text.replace("borsagator-digest-status: running",
                                      "borsagator-digest-status: failed", 1)
              lines = text.split("\n")
              if "⚠️ FAILED" not in lines[0]:
                  lines[0] = lines[0].rstrip() + " — ⚠️ FAILED"
                  text = "\n".join(lines)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          PYEOF
          fi
          if [ -f digest/digest.md ]; then
            title=$(head -n 1 digest/digest.md | sed 's/^# //')
            if [ -z "$title" ]; then
              job=$(python3 -c "import json; print(json.load(open('digest/digest.json')).get('job',''))" 2>/dev/null || echo "")
              if [ -n "$job" ]; then
                title="🐊 Borsagator digest — $job"
              else
                title="🐊 Borsagator digest — run ${{ github.run_id }}"
              fi
            fi
            gh issue create --title "$title" --body-file digest/digest.md --label borsagator \
              || gh issue create --title "$title" --body-file digest/digest.md
          fi
