name: Borsagator

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job, e.g. 'sweep POUL.CA' or 'run tradingagents POUL.CA' (empty = use the JOB variable)"
        required: false
        default: ""
  schedule:
    # Sun–Thu 06:15 UTC = 08:15 Cairo (winter) / 09:15 (summer DST) — always
    # before the EGX 10:00 open. Scheduled runs use the JOB_SCHEDULED
    # variable (default 'sweep-lite POUL.CA').
    - cron: "15 6 * * 0,1,2,3,4"

permissions:
  contents: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute the fleet repository list
        id: fleet
        run: |
          repos=$(python3 -c "import json; rs=[t['repo'] for t in json.load(open('registry/tools.json'))['tools']]; print(','.join(['borsagator'] + rs))")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "Token scope: $repos"

      - name: Mint the Borsagator app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BORSAGATOR_APP_ID }}
          private-key: ${{ secrets.BORSAGATOR_APP_PRIVATE_KEY }}
          owner: moos-labs
          repositories: ${{ steps.fleet.outputs.repos }}

      - name: Install the token-minting dependency
        run: pip install pyjwt cryptography

      - name: Run the gator
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The orchestrator mints/refreshes its own installation tokens
          # from these (App tokens live 1h; full sweeps run longer).
          BORSAGATOR_APP_ID: ${{ secrets.BORSAGATOR_APP_ID }}
          BORSAGATOR_APP_PRIVATE_KEY: ${{ secrets.BORSAGATOR_APP_PRIVATE_KEY }}
          JOB: ${{ github.event_name == 'schedule' && (vars.JOB_SCHEDULED || 'sweep-lite POUL.CA') || inputs.job || vars.JOB }}
        run: python3 scripts/orchestrate.py

      - name: Run the ensemble synthesizer
        if: always()
        run: python3 scripts/ensemble.py || true

      - name: Stage the sweep archive
        if: always()
        run: python3 scripts/archive.py || true

      - name: Commit the archive
        if: always()
        run: |
          if [ -f archive_stage/TARGET.txt ]; then
            TARGET=$(cat archive_stage/TARGET.txt)
            git config user.name "borsagator-archive"
            git config user.email "moos@sherbeeny.com"
            if git ls-remote --exit-code origin archive >/dev/null 2>&1; then
              git fetch origin "+refs/heads/archive:refs/remotes/origin/archive"
              git worktree add -b archive /tmp/arch origin/archive
            else
              git worktree add --orphan -b archive /tmp/arch
            fi
            mkdir -p "/tmp/arch/$TARGET"
            cp -r archive_stage/data/. "/tmp/arch/$TARGET/"
            cd /tmp/arch
            git add -A
            git commit -m "Archive sweep: $TARGET" || echo "nothing to commit"
            git push origin archive || echo "ARCHIVE PUSH FAILED (non-fatal)"
          fi

      # Issue #64: after the sweep is archived, rerun the calibration
      # ledger against the archive and publish ledger/ to main. The
      # publisher validates the run, appends a ledger section (or a
      # ⚠️ failure line) to the digest, and commits only on change.
      # It never fails the sweep. The token is the workflow token
      # (contents: write) — the App token has no Contents access.
      - name: Rerun + publish the calibration ledger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ledger_publish.py --digest digest/digest.md --commit

      - name: Upload the digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest/
          if-no-files-found: ignore

      - name: Open the digest issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Issue #113: never file with an empty title. The gator now
          # heads digest.md up front, but a headerless/missing file
          # must still fall back to digest.json's job — the JSON is
          # written before the markdown and survives a gator death
          # (run 43815097317: head -n 1 of a headerless file was empty
          # and `gh issue create --title ""` failed, losing the digest).
          if [ ! -f digest/digest.md ] && [ -f digest/digest.json ]; then
            job=$(python3 -c "import json; print(json.load(open('digest/digest.json')).get('job',''))" 2>/dev/null || echo "")
            job=${job:-"run ${{ github.run_id }}"}
            printf '# 🐊 Borsagator digest — %s\n\n_Gator digest missing — see digest.json._\n' "$job" > digest/digest.md
          fi
          if [ -f digest/digest.md ]; then
            title=$(head -n 1 digest/digest.md | sed 's/^# //')
            if [ -z "$title" ]; then
              job=$(python3 -c "import json; print(json.load(open('digest/digest.json')).get('job',''))" 2>/dev/null || echo "")
              if [ -n "$job" ]; then
                title="🐊 Borsagator digest — $job"
              else
                title="🐊 Borsagator digest — run ${{ github.run_id }}"
              fi
            fi
            gh issue create --title "$title" --body-file digest/digest.md --label borsagator \
              || gh issue create --title "$title" --body-file digest/digest.md
          fi
