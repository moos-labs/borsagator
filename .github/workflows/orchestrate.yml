name: Borsagator

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job, e.g. 'sweep POUL.CA' or 'run tradingagents POUL.CA' (empty = use the JOB variable)"
        required: false
        default: ""
  schedule:
    # Sun–Thu 06:15 UTC = 08:15 Cairo (winter) / 09:15 (summer DST) — always
    # before the EGX 10:00 open. Scheduled runs use the JOB_SCHEDULED
    # variable (default 'sweep-lite POUL.CA').
    - cron: "15 6 * * 0,1,2,3,4"

permissions:
  contents: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute the fleet repository list
        id: fleet
        run: |
          repos=$(python3 -c "import json; rs=[t['repo'] for t in json.load(open('registry/tools.json'))['tools']]; print(','.join(['borsagator'] + rs))")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "Token scope: $repos"

      - name: Mint the Borsagator app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BORSAGATOR_APP_ID }}
          private-key: ${{ secrets.BORSAGATOR_APP_PRIVATE_KEY }}
          owner: moos-labs
          repositories: ${{ steps.fleet.outputs.repos }}

      - name: Run the gator
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JOB: ${{ github.event_name == 'schedule' && (vars.JOB_SCHEDULED || 'sweep-lite POUL.CA') || inputs.job || vars.JOB }}
        run: python3 scripts/orchestrate.py

      - name: Run the ensemble synthesizer
        if: always()
        run: python3 scripts/ensemble.py || true

      - name: Stage the sweep archive
        if: always()
        run: python3 scripts/archive.py || true

      - name: Commit the archive
        if: always()
        run: |
          if [ -f archive_stage/TARGET.txt ]; then
            TARGET=$(cat archive_stage/TARGET.txt)
            git config user.name "borsagator-archive"
            git config user.email "moos@sherbeeny.com"
            if git ls-remote --exit-code origin archive >/dev/null 2>&1; then
              git fetch origin "+refs/heads/archive:refs/remotes/origin/archive"
              git worktree add -b archive /tmp/arch origin/archive
            else
              git worktree add --orphan -b archive /tmp/arch
            fi
            mkdir -p "/tmp/arch/$TARGET"
            cp -r archive_stage/data/. "/tmp/arch/$TARGET/"
            cd /tmp/arch
            git add -A
            git commit -m "Archive sweep: $TARGET" || echo "nothing to commit"
            git push origin archive || echo "ARCHIVE PUSH FAILED (non-fatal)"
          fi

      - name: Upload the digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest/
          if-no-files-found: ignore

      - name: Open the digest issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f digest/digest.md ]; then
            title=$(head -n 1 digest/digest.md | sed 's/^# //')
            gh issue create --title "$title" --body-file digest/digest.md --label borsagator \
              || gh issue create --title "$title" --body-file digest/digest.md
          fi
