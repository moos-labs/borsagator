name: Crypto spread sampler

# Round 147 s.6 / INS-IMPROVE-162: hourly BTC-USD / ETH-USD top-of-book
# snapshot (Coinbase Exchange + Kraken public tickers) appended to
# evaluation/crypto_spread_samples.jsonl. LLM-free, stdlib only, no keys needed.
# Scheduled workflows run only from the default branch; the push trigger
# below (this branch only, this workflow file only) gives a first-run proof
# before the workflow is on the default branch. Remove it once merged.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [improve-147-crypto-prereg]
    paths: [".github/workflows/crypto-spread-sampler.yml"]

permissions:
  contents: write

concurrency:
  group: crypto-spread-sampler
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot
        run: |
          before=$(wc -l < evaluation/crypto_spread_samples.jsonl)
          python3 scripts/sample_crypto_spreads.py --out evaluation/crypto_spread_samples.jsonl
          after=$(wc -l < evaluation/crypto_spread_samples.jsonl)
          echo "rows before=$before after=$after"
          test "$after" -gt "$before"
      - name: Commit appended rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/crypto_spread_samples.jsonl
          git commit -m "crypto spread sampler: hourly snapshot"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
