name: promotion-gate

# Frozen-candidate gate for worker-release promotions (issue #145).
# A promotion PR must come from a frozen `promote/<sha>` branch whose
# head is exactly the reviewed SHA recorded in the PR body's
# `Reviewed-SHA:` trailer. PRs opened from live `main` (whose head
# drifts as commits land) fail this check, as does any head that no
# longer equals the reviewed SHA. See docs/promotion.md and
# scripts/promote.py. This check is a REQUIRED status check on
# worker-release (since 2026-11-17); a red X here means "do not merge".
#
# Issue #198 (2026-11-18): this gate failed 6/6 runs on two valid
# frozen candidates (PR #200: opened, edited, reopened, re-run; PR
# #202: opened, re-run) although the identical checks pass locally
# against the PRs' API state -- and failed WITHOUT any diagnostic
# output, so the cause could not be observed. The step therefore
# takes ALL of its facts from the API (`gh api` on the PR number
# from the event context) and never reads the event payload file;
# every failure path -- API failure, unexpected exception, or a
# genuine mismatch -- emits a ::error:: annotation naming the cause
# and the compared values, so a future red is diagnosable from the
# check-run annotations API without downloading run logs.
on:
  pull_request:
    branches: [worker-release]
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

jobs:
  frozen-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check head is the frozen reviewed SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          try:
              repo = os.environ["REPO"]
              number = os.environ["PR_NUMBER"]
              print("gate fetching PR %s/%s from the API" % (repo, number))
              out = subprocess.run(
                  ["gh", "api", "repos/%s/pulls/%s" % (repo, number)],
                  capture_output=True, text=True, timeout=60)
              if out.returncode != 0:
                  print("::error::PROMOTION GATE FAILED: gh api call "
                        "failed (rc=%s): %s"
                        % (out.returncode,
                           (out.stderr or out.stdout or "")[:500]))
                  sys.exit(1)
              api = json.loads(out.stdout)
              head_ref = api["head"]["ref"]
              head_sha = api["head"]["sha"]
              body = api.get("body") or ""
              print("gate head_ref=%s head_sha=%s" % (head_ref, head_sha))
              m = re.search(r"^Reviewed-SHA:\s*([0-9a-f]{40})\s*$",
                            body, re.M)
              print("trailer found=%s" % bool(m))
              errors = []
              if head_ref == "main":
                  errors.append("head branch is live main; promotion PRs "
                                "must come from a frozen promote/<sha> "
                                "branch (#145)")
              if not m:
                  errors.append("PR body has no Reviewed-SHA: <40-hex> "
                                "trailer")
              elif m.group(1) != head_sha:
                  errors.append("head SHA %s != reviewed SHA %s; candidate "
                                "drifted, re-freeze"
                                % (head_sha, m.group(1)))
              elif head_ref != "promote/" + head_sha[:12]:
                  errors.append("head branch %r is not the frozen branch "
                                "promote/%s" % (head_ref, head_sha[:12]))
              if errors:
                  print("PROMOTION GATE FAILED:")
                  for e in errors:
                      print("  -", e)
                      print("::error::PROMOTION GATE FAILED: %s "
                            "(head_ref=%s head_sha=%s)"
                            % (e, head_ref, head_sha))
                  sys.exit(1)
              print("PROMOTION GATE PASSED: head %s == reviewed SHA"
                    % head_sha)
          except SystemExit:
              raise
          except Exception as e:  # noqa: BLE001 - never die silently
              print("::error::PROMOTION GATE ERROR: %s: %s"
                    % (type(e).__name__, e))
              sys.exit(1)
          PY
