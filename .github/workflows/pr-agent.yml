# PR-Agent - self-hosted AI PR reviewer (workforce survey 2026-11-18, #215).
# Runs on our own OpenRouter key (repo secret OPENROUTER_API_KEY); no code
# goes to any new third party. Permissions are the workflow token's only:
# contents: read, pull-requests: write, issues: write. It cannot merge -
# merges stay gated on moos-sherbo's review, every time.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    name: Run PR Agent on every pull request
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
