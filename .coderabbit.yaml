# CodeRabbit configuration for moos-labs/borsagator (#215).
# CodeRabbit is installed on this repository only. Reviews are
# advisory; merges stay gated on moos-sherbo's review, every time.
language: "en-US"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
